<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you &ndash; CreditReports.dk</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.creditreports.dk/en/thankyou/">
    <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .ty-shell {
      display: flex;
      justify-content: center;
      padding: calc(var(--nav-h) + 3rem) 1rem 4rem;
      min-height: 100vh;
      background: var(--off-white);
    }
    .ty-card {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: fit-content;
      background: var(--white);
      border: 1px solid var(--color-border);
      border-radius: var(--r-xl);
      padding: clamp(1.75rem, 4vw, 2.75rem);
      box-shadow: 0 10px 30px rgba(11,31,58,0.06);
      text-align: center;
    }
    .ty-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 34px;
      height: 34px;
      border: 1px solid var(--color-border);
      border-radius: 50%;
      color: var(--gray-steel);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--trs), color var(--trs);
    }
    .ty-close:hover { background: var(--off-white); color: var(--charcoal); }
    .ty-close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.1; fill: none; }
    .ty-badge {
      width: 54px;
      height: 54px;
      margin: 0.25rem auto 1.25rem;
      border-radius: 50%;
      background: var(--status-green-bg);
      color: var(--status-green);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ty-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin: 0 0 0.6rem;
      color: var(--charcoal);
    }
    .ty-lead {
      margin: 0 auto 1.5rem;
      max-width: 46ch;
      color: var(--gray-steel);
      font-size: var(--text-sm);
      line-height: 1.65;
    }
    .ty-panel {
      text-align: left;
      background: var(--off-white);
      border: 1px solid var(--color-border);
      border-radius: var(--r-lg);
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .ty-panel-title {
      font-size: var(--text-base);
      font-weight: 600;
      margin: 0 0 0.5rem;
      color: var(--charcoal);
    }
    .ty-text {
      font-size: var(--text-xs);
      line-height: 1.65;
      color: var(--gray-steel);
      margin: 0 0 0.6rem;
    }
    .ty-text:last-child { margin-bottom: 0; }
    .ty-text a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .ty-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="site-nav"></div>

<main>
  <section class="ty-shell" aria-labelledby="ty-title">
    <div class="ty-card" data-checkout-status>
      <a class="ty-close" href="/en/" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>

<h1 class="ty-title" id="ty-title" data-checkout-title>Checking payment…</h1>
      <p class="ty-lead" data-checkout-message>
        We are checking your payment status with Stripe.
      </p>

      <div class="ty-panel" data-checkout-next hidden>
        <h2 class="ty-panel-title">What happens next</h2>
        <p class="ty-text">Check your inbox and spam folder for the report delivery email.</p>
        <p class="ty-text">The PDF is sent to the address you entered at checkout. Questions? Contact us at
          <a href="mailto:info@creditreports.dk">info@creditreports.dk</a>.
        </p>
      </div>

      <a class="btn btn-primary" style="width:100%;justify-content:center;" href="/en/">Back to CreditReports.dk</a>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="../../js/main.js"></script>
<script src="../../js/nav.js"></script>
<script src="../../js/checkout-return.js"></script>
</body>
</html>
